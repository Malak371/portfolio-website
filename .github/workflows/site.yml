name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Validate HTML
        run: npm run check:html

      # The site is served under /portfolio-website/, so mirror that layout
      # for the link checker to resolve root-relative links.
      - name: Prepare link check
        run: mkdir -p _site && cp -r dist _site/portfolio-website

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn and some sites block automated requests (999/403), so they
          # are excluded in lychee.toml; everything else must resolve.
          args: --config lychee.toml --root-dir "${{ github.workspace }}/_site" "_site/**/*.html"
          fail: true

      - name: Report remaining placeholders
        run: |
          count=$(grep -c "TODO" src/data/site.yaml || true)
          if [ "$count" -gt 0 ]; then
            echo "::warning file=src/data/site.yaml::$count lines in site.yaml still contain TODO placeholders"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
