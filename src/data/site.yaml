projects:
  - title: Health & Performance Aggregator
    tagline: Sleep, activity, mood, training and study load in one dashboard, with explainable recovery and burnout-risk insights.
    problem: Health and performance data is spread across apps (Apple Health, Fitbit, training logs), so it's hard to see how sleep, training and study load affect each other.
    solution: A FastAPI service ingests CSV, Apple Health and Fitbit exports, computes rolling training load (ACWR), a recovery score, a transparent burnout-risk score, anomalies and a next-day readiness prediction that shows which signals drive it. A Streamlit dashboard draws the results.
    impact: Live demo with no sign-up, on synthetic data or your own export. 120+ pytest tests run in CI against SQLite and PostgreSQL. The model is evaluated honestly against a "tomorrow is like today" baseline and validated on a public dataset of 16 people.
    stack: [Python, FastAPI, PostgreSQL, SQLAlchemy, scikit-learn, pandas, Streamlit, Docker, GitHub Actions]
    image: health-aggregator.png
    imageAlt: Health & Performance Aggregator dashboard showing readiness, burnout risk, load ratio and a week-over-week summary
    links:
      live: https://health-performance-aggregator.streamlit.app/
      code: https://github.com/Malak371/health-aggregator
    note: Free hosting sleeps when idle, so the first load can take about a minute.

  - title: Finance Tracker
    tagline: Import a bank statement and see where your money goes, with categorisation that learns from your corrections.
    problem: Bank statements come in inconsistent CSV formats, and categorising and budgeting transactions by hand is tedious.
    solution: A React app and FastAPI backend that import any bank CSV (delimiters, encodings, date and amount formats), skip duplicates, categorise transactions with your rules plus a per-user Naive Bayes model, detect recurring charges and warn before a budget runs out.
    impact: Live demo where each visitor gets a private account with a year of realistic data. 149 backend, 25 frontend and 5 end-to-end tests run in CI, including one that checks every endpoint requires sign-in, so no user can see another's data.
    stack: [React, Vite, Tailwind CSS, FastAPI, PostgreSQL, SQLAlchemy, Playwright, Docker, GitHub Actions]
    image: finance-tracker.png
    imageAlt: Finance Tracker dashboard with a budget alert, monthly spending totals and spending insights
    links:
      live: https://finance-tracker-and-manager.vercel.app
      code: https://github.com/Malak371/finance-tracker
    note: The demo needs no sign-up. Its API can take up to a minute to wake up.

  - title: NPA Studio
    tagline: A production platform that turns a nonprofit's uploaded documents into a structured fundability assessment.
    private: true
    organization: A Chance In Life
    problem: Nonprofits seeking evaluations, advisors offering reports to their clients, and funders vetting grantees all need a structured read on how fundable an organization is.
    role: Special Projects Assistant at A Chance In Life. I designed, built and deployed the platform, owning the backend, data model and deployment end to end, and worked with non-technical program and leadership staff to turn their needs into features.
    solution: User accounts, tiered pricing, sample reports, a Fundraising Hub resource center and an interactive needs-assessment guide. Uploaded documents are processed in the background and turned into reports with the Claude API.
    architecture: A Flask 3 app on Gunicorn with PostgreSQL (SQLAlchemy 2, Alembic migrations). Uploads are stored in Cloudflare R2. Redis/RQ background workers extract text from PDFs with pypdf, fall back to OCR (pdf2image, Tesseract) for scanned files, and call the Claude API to generate the report. Stripe handles tiered payments and Resend sends transactional email.
    impact: Live at npastudio.com, handling paid accounts and sensitive documents. Secured with TOTP two-factor authentication, bcrypt password hashing, CSRF protection, rate limiting on sign-in routes and MIME-based upload validation.
    stack: [Python, Flask, PostgreSQL, SQLAlchemy, Alembic, Redis, RQ, Claude API, Stripe, Cloudflare R2, Tesseract OCR]
    image: npa-studio.jpg
    imageAlt: NPA Studio home page with a guide asking what problem the visitor needs solved
    links:
      live: https://www.npastudio.com

  - title: Health & Wellness Lab
    tagline: A mobile-first web app that helps people track what they eat, with barcode scanning, nutrition scores and rewards.
    private: true
    organization: A Chance In Life
    problem: People in A Chance In Life's wellness program needed a free, simple way to see what's in their food and track what they eat, on whatever phone or computer they have.
    role: Special Projects Assistant at A Chance In Life. I built and deployed the app, owning the backend, data model and deployment end to end.
    solution: A progressive web app with in-browser barcode scanning, a food diary, A–E nutrition scores, recipe ideas, a health coach and a rewards system for healthy habits.
    architecture: A Next.js 15 (App Router) and React 19 frontend in TypeScript and Tailwind CSS, exported as a static PWA on Cloudflare Pages, with two Pages Functions for sign-up and admin password resets. Supabase provides PostgreSQL and Auth, with row-level security on user data. Barcodes are read in the browser with ZXing, nutrition data comes from the Open Food Facts API, Nutri-Scores are computed locally, and the Anthropic Claude SDK powers the AI features.
    impact: Live at wellnesslab.achanceinlife.org as a free program for the public; installable on phones from the browser.
    stack: [TypeScript, Next.js, React, Tailwind CSS, Supabase, PostgreSQL, Cloudflare Pages, ZXing, Claude SDK]
    image: wellness-lab.jpg
    imageAlt: Health & Wellness Lab home page reading "Eat better, one scan at a time" with sign-in and create-account buttons
    links:
      live: https://wellnesslab.achanceinlife.org/

