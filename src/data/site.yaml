projects:
  - title: Health & Performance Aggregator
    tagline: Sleep, activity, mood, training and study load in one dashboard, with explainable recovery and burnout-risk insights.
    problem: Health and performance data is spread across apps (Apple Health, Fitbit, training logs), so it's hard to see how sleep, training and study load affect each other.
    solution: A FastAPI service ingests CSV, Apple Health and Fitbit exports, computes rolling load (ACWR), a recovery score, a transparent burnout-risk score, anomalies and a next-day readiness prediction; a Streamlit dashboard draws the results.
    impact: "TODO: add impact or metric (e.g. test coverage, users, data volume)"
    stack: [Python, FastAPI, PostgreSQL, SQLAlchemy, Alembic, scikit-learn, pandas, Streamlit, Docker, GitHub Actions]
    image: health-aggregator.png
    imageAlt: Health & Performance Aggregator dashboard showing a weekly summary of sleep, activity and mood
    links:
      live: https://health-performance-aggregator.streamlit.app/
      code: https://github.com/Malak371/health-aggregator
      # video: TODO: add demo video URL
    note: Free hosting sleeps when idle, so the first load can take about a minute.

  - title: Finance Tracker
    tagline: Import a bank statement and see where your money goes, with categorisation that learns from your corrections.
    problem: Bank statements come in inconsistent CSV formats, and categorising and budgeting transactions by hand is tedious.
    solution: A React SPA and FastAPI backend that import any bank CSV (delimiters, encodings, date and amount formats), skip duplicates, categorise transactions with rules plus a per-user Naive Bayes model, detect recurring charges and warn before budgets run out.
    impact: "TODO: add impact or metric"
    stack: [React, Vite, Tailwind CSS, FastAPI, PostgreSQL, SQLAlchemy, Naive Bayes, Playwright, Docker]
    image: finance-tracker.png
    imageAlt: Finance Tracker dashboard with budget alerts, spending insights and a monthly trend chart
    links:
      live: https://finance-tracker-and-manager.vercel.app
      code: https://github.com/Malak371/finance-tracker
      # video: TODO: add demo video URL
    note: The demo needs no sign-up. Its API can take up to a minute to wake up.

