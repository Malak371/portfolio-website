# Link checker config (https://lychee.cli.rs). Used by the CI workflow.

# These sites block automated requests even though the links work in a browser.
exclude = [
  "^https://(www\\.)?linkedin\\.com/",
  "^https://wellnesslab\\.achanceinlife\\.org",
  # The site's own canonical/Open Graph URLs (they point at the live site,
  # which only has the new files after this build is deployed).
  "^https://portfolio-website-malak\\.netlify\\.app",
]

# Streamlit apps answer anonymous requests with a 303 to a login page that then
# loads the public app, and free-tier APIs can be slow to wake up.
accept = ["200..=299", "303"]
max_redirects = 10
timeout = 60
max_retries = 3
